[project]
name = "deck-router"
version = "0.1.0"
description = "Decision and LLM router for existing deck creation and editing A2A services"
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk[http-server]==1.3.0",
    "httpx>=0.28",
    "openai>=2,<3",
    "protobuf>=5.29",
    "pydantic>=2.11",
    "pydantic-settings>=2.8",
    "starlette>=0.46",
    "typesafe-sdk>=0.7.5",
    "uvicorn>=0.35",
]

[project.scripts]
deck-router = "deck_router.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deck_router", "src/downstream_mock"]
