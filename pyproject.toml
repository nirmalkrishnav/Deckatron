[project]
name = "deckatron"
version = "0.1.0"
description = "Independently deployable A2A services"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["src/deck-router", "src/mock"]

[tool.uv.sources]
downstream-mock = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["src/deck-router/tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.src]
include = ["src/deck-router/src", "src/deck-router/tests", "src/mock/downstream_mock"]

[dependency-groups]
dev = [
    "downstream-mock",
    "httpx",
    "ipykernel",
    "ipywidgets",
    "protobuf",
    "pytest",
    "ruff",
    "tqdm",
    "ty",
]
